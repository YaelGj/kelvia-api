# Configure la vitrine de chaque « VM » à partir du modèle vitrine.html.j2.
# Les valeurs (environnement, couleur, maintenance) viennent de group_vars/.
- hosts: all
  tasks:
    - name: Configurer la vitrine
      ansible.builtin.template:
        src: vitrine.html.j2
        dest: /srv/index.html
